version: "2"
sql:
- schema: "./db/migration/"
  queries: "./db/query/"
  engine: "postgresql"
  gen:
    go:
      sql_package: "database/sql"
      package: "db"
      out: "./db/sqlc"
      emit_json_tags: true
      emit_interface: true
      emit_empty_slices: true
